rules:
  - id: missing-ownership-check
    patterns:
    - pattern: |
        let $ACC2 = <... next_account_info(...) ...>;
        ...
        let $ACC = <... next_account_info(...) ...>;
        ...
        if $ACC.$FOO != $ACC2.$BAR() {
          ...
        }
    - pattern-not: |
        let $ACC2 = <... next_account_info(...) ...>;
        ...
        let $ACC = <... next_account_info(...) ...>;
        ...
        if $ACC.owner != program_id {
          ...
        }
        ...
        if $ACC.$FOO != $ACC2.$BAR() {
          ...
        }
    - pattern-not: |
        let $ACC2 = <... next_account_info(...) ...>;
        ...
        let $ACC = <... next_account_info(...) ...>;
        ...
        if $ACC.$FOO != $ACC2.$BAR() {
          ...
        }
        ...
        if $ACC.owner != program_id {
          ...
        }
    message: "Potentially missing ownership check. Did you forget to check that $ACC.owner != program_id?"
    languages: [ rust ]
    severity: ERROR
    metadata:
      url: https://blog.neodyme.io/posts/solana_common_pitfalls#missing-ownership-check
