rules:
  - id: missing-signer-check
    patterns:
    - pattern: |
        let $ACC = <... next_account_info(...) ...>;
        ...
        let $ACC2 = <... next_account_info(...) ...>;
        ...
        if $ACC2.pubkey() != $ACC.admin {
          ...
        }
    - pattern-not: |
        let $ACC = <... next_account_info(...) ...>;
        ...
        let $ACC2 = <... next_account_info(...) ...>;
        ...
        if $ACC2.pubkey() != $ACC.admin {
          ...
        }
        ...
        if !$ACC2.is_signer {
          ...
        }
    - pattern-not: |
        let $ACC = <... next_account_info(...) ...>;
        ...
        let $ACC2 = <... next_account_info(...) ...>;
        ...
        if !$ACC2.is_signer {
          ...
        }
        ...
        if $ACC2.pubkey() != $ACC.admin {
          ...
        }
    message: "Potentially missing is_signer check. Did you forget to check that $ACC2.is_signer?, $ACC, $ACC2"
    languages: [ rust ]
    severity: ERROR
    metadata:
      url: https://blog.neodyme.io/posts/solana_common_pitfalls#missing-signer-check
