rules:
  - id: algorand-rekey-zero-address
    message: |
      RekeyTo property of any transaction is set to the ZeroAddress 
      unless the contract is specifically involved in a rekeying operation.
      For more info, see https://developer.algorand.org/docs/get-details/dapps/avm/teal/guidelines/
    patterns: 
      - pattern: |
          $TXN.type_enum() == TxnType.$TYPE
      - pattern-not-inside: | 
          <... $TXN.rekey_to() == Gloabl.zero_address() ...>
    languages: [python]
    severity: WARNING
    metadata:
      category: security
      technology:
        - pyteal
      